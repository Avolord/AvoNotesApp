name: Release

# Push a tag like v0.2.0 (or v0.2.0-alpha / -beta for a pre-release) to build a signed
# APK and publish it as a GitHub release.
#
# Needs these repository secrets (Settings > Secrets and variables > Actions):
#   AVONOTES_KEYSTORE_BASE64   base64 of the release keystore (.jks)
#   AVONOTES_KEYSTORE_PASSWORD
#   AVONOTES_KEY_ALIAS
#   AVONOTES_KEY_PASSWORD
# Always sign with the same keystore, or existing installs can't update.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build signed APK & publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.AVONOTES_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No AVONOTES_KEYSTORE_BASE64 secret: skipping the signed build. Publish the APK by hand or add the signing secrets."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Lint and build signed release APK
        if: steps.keystore.outputs.ok == 'true'
        env:
          AVONOTES_KEYSTORE: ${{ runner.temp }}/release.jks
          AVONOTES_KEYSTORE_PASSWORD: ${{ secrets.AVONOTES_KEYSTORE_PASSWORD }}
          AVONOTES_KEY_ALIAS: ${{ secrets.AVONOTES_KEY_ALIAS }}
          AVONOTES_KEY_PASSWORD: ${{ secrets.AVONOTES_KEY_PASSWORD }}
        run: ./gradlew --no-daemon lintDebug assembleRelease

      - name: Name the APK after the tag
        if: steps.keystore.outputs.ok == 'true'
        run: cp app/build/outputs/apk/release/app-release.apk "AvoNotes-${GITHUB_REF_NAME}.apk"

      # The release notes are the annotated tag's message (git tag -a vX -F notes.md).
      - name: Release notes from the tag message
        if: steps.keystore.outputs.ok == 'true'
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Publish GitHub release
        if: steps.keystore.outputs.ok == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: AvoNotes-${{ github.ref_name }}.apk
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          body_path: ${{ runner.temp }}/notes.md
          generate_release_notes: true

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
